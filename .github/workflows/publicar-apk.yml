name: Compilar y Publicar APK

on:
  push:
    branches:
      - master
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde GitHub si lo deseas

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Preparar archivo APK para distribución
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk codise.apk

      - name: Publicar o Actualizar Release 'latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Última Versión (master)"
          body: |
            APK generado automáticamente a partir de la rama `master`.
            - **Commit**: `${{ github.sha }}`
            - **Fecha**: `${{ github.event.head_commit.timestamp }}`
          draft: false
          prerelease: false
          make_latest: true
          files: codise.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
